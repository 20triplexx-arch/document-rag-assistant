name: Windows full installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: First installation with actual public textbooks
        shell: powershell
        run: ./setup.ps1 -PythonPath (Get-Command python).Source
      - name: Verify installed application
        shell: powershell
        run: ./verify.ps1 -Profile App
      - name: Verify idempotent installation
        shell: powershell
        run: ./setup.ps1
      - name: Real loopback HTTP smoke, retrieval only
        shell: powershell
        run: ./.venv/Scripts/python.exe scripts/install_smoke.py
      - name: Save sanitized smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-result
          path: output/install-smoke-result.json
          if-no-files-found: ignore
